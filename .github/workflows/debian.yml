name: Ubuntu RDP - Acesso

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Instalar XFCE, XRDP e Dependências
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            xrdp \
            dbus-x11 \
            openssh-client

      - name: Criar usuário
        run: |
          sudo useradd -m -s /bin/bash rdpuser
          echo 'rdpuser:123456' | sudo chpasswd
          sudo usermod -aG sudo rdpuser

      - name: Configurar Ambiente e XFCE
        run: |
          # Define a sessão correta para o xrdp carregar o XFCE
          echo "xfce4-session" | sudo tee /home/rdpuser/.xsession
          
          # Injeta as variáveis de ambiente necessárias para evitar o erro de failsafe
          echo "export XDG_CURRENT_DESKTOP=XFCE" | sudo tee -a /home/rdpuser/.bashrc
          echo "export XDG_DATA_DIRS=/usr/share/xfce4:/usr/share:/usr/local/share" | sudo tee -a /home/rdpuser/.bashrc
          
          # Corrige permissões de dono do diretório do usuário
          sudo chown -R rdpuser:rdpuser /home/rdpuser/

      - name: Iniciar XRDP
        run: |
          # Adiciona o usuário xrdp ao grupo ssl-cert para evitar erros de certificado
          sudo adduser xrdp ssl-cert || true
          sudo systemctl enable xrdp
          sudo systemctl restart xrdp
          sleep 5

          echo "===== XRDP ====="
          sudo ss -lntp | grep ':3389'

      - name: Criar túnel TCP
        run: |
          echo "=========================================="
          echo "        CRIANDO ACESSO RDP"
          echo "=========================================="

          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -p 443 \
            -R0:localhost:3389 \
            tcp@free.pinggy.io 2>&1 | tee pinggy.log &

          echo "Esperando o endereço..."
          
          for i in {1..30}; do
            if grep -qE 'tcp://[^ ]+' pinggy.log; then
              break
            fi
            sleep 2
          done

          ENDPOINT=$(grep -oE 'tcp://[^ ]+' pinggy.log | head -1 | sed 's#tcp://##')

          echo
          echo "=========================================="
          echo "             RDP ONLINE"
          echo "=========================================="
          echo
          echo "ENDEREÇO:"
          echo "$ENDPOINT"
          echo
          echo "USUÁRIO:"
          echo "rdpuser"
          echo
          echo "SENHA:"
          echo "123456"
          echo
          echo "=========================================="

          if [ -z "$ENDPOINT" ]; then
            echo "ERRO: não foi possível obter o endereço."
            cat pinggy.log
            exit 1
          fi

      - name: Manter RDP ativo
        run: |
          echo "Servidor RDP ativo."
          echo "Não feche/cancele este workflow."

          while true; do
            sleep 30
          done

name: Ubuntu VNC - Acesso

on:
  workflow_dispatch:

jobs:
  vnc:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Instalar XFCE, VNC Server e Dependências
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            xfce4 \
            xfce4-goodies \
            tigervnc-standalone-server \
            dbus-x11 \
            openssh-client

      - name: Criar usuário e configurar o VNC
        run: |
          # Cria o usuário normal
          sudo useradd -m -s /bin/bash rdpuser
          echo 'rdpuser:123456' | sudo chpasswd
          sudo usermod -aG sudo rdpuser

          # Cria a pasta de configuração do VNC do usuário
          sudo mkdir -p /home/rdpuser/.vnc
          
          # Define a senha de acesso do VNC (usando a mesma: 123456)
          echo "123456" | sudo vncpasswd -f > /home/rdpuser/.vnc/passwd
          sudo chmod 600 /home/rdpuser/.vnc/passwd

          # Cria o arquivo xstartup para forçar a inicialização do XFCE
          cat << 'EOF' | sudo tee /home/rdpuser/.vnc/xstartup
          #!/bin/sh
          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS
          export XDG_CURRENT_DESKTOP=XFCE
          exec /usr/bin/startxfce4
          EOF
          
          sudo chmod +x /home/rdpuser/.vnc/xstartup
          sudo chown -R rdpuser:rdpuser /home/rdpuser/

      - name: Iniciar o Servidor VNC
        run: |
          # Inicia o servidor VNC na tela :1 (Porta padrão 5901) usando o usuário criado
          sudo -u rdpuser vncserver :1 -geometry 1280x720 -depth 24
          
          echo "===== VNC STATUS ====="
          sudo ss -lntp | grep ':5901'

      - name: Criar túnel TCP (Porta 5901)
        run: |
          echo "=========================================="
          echo "        CRIANDO ACESSO VNC"
          echo "=========================================="

          # Redireciona a porta 5901 do VNC através do túnel do Pinggy
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=3 \
            -p 443 \
            -R0:localhost:5901 \
            tcp@free.pinggy.io 2>&1 | tee pinggy.log &

          echo "Esperando o endereço..."
          
          for i in {1..30}; do
            if grep -qE 'tcp://[^ ]+' pinggy.log; then
              break
            fi
            sleep 2
          done

          ENDPOINT=$(grep -oE 'tcp://[^ ]+' pinggy.log | head -1 | sed 's#tcp://##')

          echo
          echo "=========================================="
          echo "             VNC ONLINE"
          echo "=========================================="
          echo
          echo "ENDEREÇO PARA ENTRAR NO APP VNC:"
          echo "$ENDPOINT"
          echo
          echo "SENHA DO VNC:"
          echo "123456"
          echo
          echo "=========================================="

          if [ -z "$ENDPOINT" ]; then
            echo "ERRO: não foi possível obter o endereço do túnel."
            cat pinggy.log
            exit 1
          fi

      - name: Manter VNC ativo
        run: |
          echo "Servidor VNC ativo."
          echo "Não feche/cancele este workflow."

          while true; do
            sleep 30
          done
